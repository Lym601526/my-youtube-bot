name: generate-idea
on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Arabic Font
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p ~/.fonts
          wget -q -O ~/.fonts/Amiri-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf
          fc-cache -f
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/generate_idea.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python scripts/generate_voice.py
      - run: python scripts/generate_captions.py
      - run: python scripts/fetch_footage.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - run: python scripts/assemble_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: output/
